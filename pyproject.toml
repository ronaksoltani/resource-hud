[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "terminal-resource-hud"
version = "1.0.0"
description = "A live CPU, memory, disk, and network terminal dashboard"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Ronak Soltani"}]
dependencies = ["psutil>=5.9", "rich>=13.7"]

[project.scripts]
resource-hud = "resource_hud.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
